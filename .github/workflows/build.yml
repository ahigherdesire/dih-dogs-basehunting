name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

# Needed so the "Release dev build" step can create/update the `dev` prerelease
# (the default GITHUB_TOKEN is read-only in this repo without this).
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Download verified DIH 5.0.1 SDKs
        shell: bash
        run: |
          set -euo pipefail
          DIH_SDK_DIR="$RUNNER_TEMP/dih-sdk"
          mkdir -p "$DIH_SDK_DIR"
          for mc in 26.2 26.3; do
            curl --fail --location --retry 3 --connect-timeout 20 --max-time 300 \
              "https://github.com/ahigherdesire/dih-client/releases/download/v5.0.1/DIH-Client-5.0.1-${mc}.jar" \
              --output "$DIH_SDK_DIR/DIH-Client-5.0.1-${mc}.jar"
          done
          cd "$DIH_SDK_DIR"
          sha256sum --check --strict <<'CHECKSUMS'
          7a10cdb8168856611e9d5f255f4e6331e7de3e63108c348a0da5c50d56fbd2a2  DIH-Client-5.0.1-26.2.jar
          c835b0c2f92c5622d5884682ed9685c6a8fd0874cd47dacb59c8360860ddce01  DIH-Client-5.0.1-26.3.jar
          CHECKSUMS

      - name: Build Minecraft 26.2
        run: ./gradlew build -Pmc=26.2 "-PdihJar=$RUNNER_TEMP/dih-sdk/DIH-Client-5.0.1-26.2.jar" -PdihBuildDir=build/targets --stacktrace --max-workers=2

      - name: Build Minecraft 26.3
        run: ./gradlew build -Pmc=26.3 "-PdihJar=$RUNNER_TEMP/dih-sdk/DIH-Client-5.0.1-26.3.jar" -PdihBuildDir=build/targets --stacktrace --max-workers=2

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: addon-jar
          path: build/targets/*/libs/*.jar
          if-no-files-found: error

      - name: Release dev build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Dev Build
          prerelease: true
          files: build/targets/*/libs/*.jar
